version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 9092 cho bên ngoài (Window), 29092 cho mạng nội bộ Docker
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "14333:1433"
    environment:
      ACCEPT_EULA: "Y"
      # Đã bảo mật tuyệt đối, kéo từ file .env gốc
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # 1. API Hứng Tọa Độ GPS (Container số 1)
  location_service:
    build: ./matching_location_service
    container_name: ride_hailing_location_api
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - KAFKA_BROKER=kafka:29092 # Đã chuyển sang cổng nội bộ
    depends_on:
      - mongodb
      - kafka
    restart: unless-stopped
      
  # 2. Worker Ghép Cuốc (Container số 2)
  matching_worker:
    build: ./matching_location_service
    container_name: ride_hailing_matching_worker
    command: ["python", "geo_matcher.py"]
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - KAFKA_BROKER=kafka:29092 # Đã chuyển sang cổng nội bộ
    depends_on:
      - mongodb
      - kafka 
    restart: unless-stopped

  identity-service:
    build: ./identity-service
    container_name: ride_hailing_identity
    ports:
      - "3001:3001"
    environment:
      - DB_SERVER=sqlserver
    depends_on:
      - sqlserver

  api-gateway:
    build: ./api-gateway
    container_name: ride_hailing_api_gateway
    ports:
      - "3000:3000"
    depends_on:
      - identity-service

  frontend:
    build: ./frontend
    container_name: ride_hailing_frontend
    ports:
      - "80:80"

# Khai báo Volumes nằm ngoài cùng
volumes:
  sqlserver_data:
  mongodb_data: