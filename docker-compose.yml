services:
  identity-service:
    build: ./identity-service
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-3101}:3001"
    environment:
      PORT: 3001
      DB_SERVER: ${DB_SERVER:-sqlserver}
      DB_PORT: ${DB_PORT:-1433}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-IdentityDB}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 bytes)}
    networks:
      default:
        aliases:
          - tungnv-identity
      backend:
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    ports:
      - "${GATEWAY_PORT:-3100}:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 bytes)}
      IDENTITY_SERVICE_URL: http://tungnv-identity:3001
      BOOKING_SERVICE_URL: ${BOOKING_SERVICE_URL:-http://booking-service:8080}
      LOCATION_SERVICE_URL: ${LOCATION_SERVICE_URL:-http://location_service:8000}
    depends_on:
      - identity-service
    networks:
      - default
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:3100}
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      - api-gateway
    networks:
      - default
    restart: unless-stopped

networks:
  backend:
    external: true
    name: ${BACKEND_NETWORK:-ride_hailing_main_default}

