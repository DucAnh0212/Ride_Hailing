services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "14333:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD:?Set SQL_SERVER_PASSWORD in the root .env}
    volumes:
      - sqlserver_data:/var/opt/mssql

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  booking-service:
    build: ./booking_service
    container_name: ride-hailing-booking
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=BookingDB;encrypt=true;trustServerCertificate=true
      - DB_USERNAME=sa
      - DB_PASSWORD=${SQL_SERVER_PASSWORD:?Set SQL_SERVER_PASSWORD in the root .env}
      - KAFKA_BROKER=kafka:29092
    depends_on:
      - sqlserver
      - kafka
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  location_service:
    build: ./matching_location_service
    container_name: ride_hailing_location_api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB=LocationDB
      - KAFKA_BROKER=kafka:29092
    depends_on:
      - mongodb
      - kafka
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  matching_worker:
    build: ./matching_location_service
    container_name: ride_hailing_matching_worker
    command: ["python", "geo_matcher.py"]
    environment:
      - BOOKING_SERVICE_URL=http://booking-service:8080
      - LOCATION_SERVICE_URL=http://location_service:8000
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB=MatchingDB
      - KAFKA_BROKER=kafka:29092
    depends_on:
      - mongodb
      - kafka
      - location_service
    restart: unless-stopped

  analytics_worker:
    build: ./analytics_service
    container_name: ride_hailing_analytics_worker
    environment:
      - KAFKA_BROKER=kafka:29092
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB=DataWarehouseDB
    depends_on:
      - kafka
      - mongodb
    restart: unless-stopped

  identity-service:
    build: ./identity-service
    container_name: ride_hailing_identity
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env (at least 32 bytes)}
      - DB_PORT=1433
      - DB_SERVER=sqlserver
      - DB_NAME=IdentityDB
      - DB_PASSWORD=${SQL_SERVER_PASSWORD:?Set SQL_SERVER_PASSWORD in the root .env}
    depends_on:
      - sqlserver
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/auth/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: ride_hailing_api_gateway
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in the root .env (at least 32 bytes)}
      - IDENTITY_SERVICE_URL=http://identity-service:3001
      - BOOKING_SERVICE_URL=http://booking-service:8080
      - LOCATION_SERVICE_URL=http://location_service:8000
    depends_on:
      - identity-service
      - booking-service
      - location_service
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ride_hailing_frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  sqlserver_data:
  mongodb_data:
